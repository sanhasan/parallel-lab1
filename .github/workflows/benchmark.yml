name: Tests and benchmark

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: cmuparlay/parlaylib
          ref: 51017699dcc421f80479cdb238d3092233ad0d26
          path: parlaylib
      - name: Build and run tests
        run: |
          g++ -std=c++17 -O3 -Wall -Wextra -Wpedantic -pthread \
            -Iparlaylib/include baseline.cpp parallel_quicksort.cpp tests.cpp \
            -o tests
          ./tests

  speedup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: cmuparlay/parlaylib
          ref: 51017699dcc421f80479cdb238d3092233ad0d26
          path: parlaylib
      - name: Run benchmark and collect results
        env:
          SIZE: "100000000"
          RUNS: "5"
          THREADS: "4"
          MIN_SPEEDUP: "3"
        run: |
          set +e
          stdbuf -oL -eL ./benchmark.sh 2>&1 | tee benchmark-results.txt
          benchmark_status=${PIPESTATUS[0]}
          set -e

          {
            echo "## Quicksort benchmark"
            echo
            echo "- Elements: ${SIZE}"
            echo "- Runs: ${RUNS}"
            echo "- Threads: ${THREADS}"
            echo "- Required speedup: ${MIN_SPEEDUP}x"
            echo
            echo '```text'
            cat benchmark-results.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$benchmark_status"

      - name: Configure GitHub Pages
        if: >-
          always() &&
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Generate benchmark page
        if: >-
          always() &&
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main'
        env:
          REQUIRED_SPEEDUP: "3"
          RUN_URL: >-
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 generate_benchmark_page.py \
            benchmark-results.txt pages \
            --required-speedup "$REQUIRED_SPEEDUP" \
            --run-url "$RUN_URL"

      - name: Upload GitHub Pages artifact
        if: >-
          always() &&
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

  deploy-pages:
    needs: speedup
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
